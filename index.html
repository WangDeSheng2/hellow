<style>html {
  -ms-touch-action: none;
}

body, canvas, div {
  display: block;
  outline: none;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);

  user-select: none;
  -moz-user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
  -khtml-user-select: none;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}

/* Remove spin of input type number */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
    /* display: none; <- Crashes Chrome on hover */
    -webkit-appearance: none;
    margin: 0; /* <-- Apparently some margin are still there even though it's hidden */
}

body {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  margin: 0;

  cursor: default;
  color: #888;
  background-color: #333;

  text-align: center;
  font-family: Helvetica, Verdana, Arial, sans-serif;

  display: flex;
  flex-direction: column;
}

canvas {
  background-color: rgba(0, 0, 0, 0);
}

#GameDiv, #Cocos3dGameContainer, #GameCanvas {
  width: 100%;
  height: 100%;
}

:root {
  --safe-top: env(safe-area-inset-top);
  --safe-right: env(safe-area-inset-right);
  --safe-bottom: env(safe-area-inset-bottom);
  --safe-left: env(safe-area-inset-left);
}
</style>

            index < parts.length;
            index += 1

                !part
                || part === '.'

                pathIndex < paths.length;

                        '/' + knownPath

    function decodeHtmlSafe7Bit(elementId, originalLength) {
        var element = document.getElementById(elementId);
        if (!element) {
            throw new Error('HTML-safe 7-bit Payload element not found: ' + elementId);
        }
        var encoded = element.textContent || '';
        var escaped = [0, 9, 10, 12, 13, 26, 60, 127];
        var ranges = [[161,167],[169,169],[171,172],[174,174],[176,177],[182,183],[187,187],[191,305],[308,318],[321,328],[330,382],[384,451],[461,496],[500,687],[697,727],[734,735],[741,767],[880,883],[885,887],[891,893],[895,895],[902,902],[904,906],[908,908],[910,929],[931,975],[983,1007],[1011,1011],[1014,1016],[1018,1154],[1162,1327],[1329,1366],[1369,1386]];
        var reverse = new Int16Array(2048);
        reverse.fill(-1);

        for (var rangeIndex = 0; rangeIndex < ranges.length; rangeIndex += 1) {
            for (
                var codePoint = ranges[rangeIndex][0];
                codePoint <= ranges[rangeIndex][1] && token < 1024;
                codePoint += 1
            ) {
                reverse[codePoint] = token++;
            }
        }
        if (token !== 1024) {
            throw new Error('HTML-safe 7-bit escape table size mismatch: ' + token);
        }
        var values = new Uint8Array(encoded.length * 2);
        var valueCount = 0;
        for (var index = 0; index < encoded.length; index += 1) {
            var current = encoded.charCodeAt(index);
            if (current <= 127) {
                if (
                    current === 0
                    || current === 9
                    || current === 10
                    || current === 12
                    || current === 13
                    || current === 26
                    || current === 60
                    || current === 127
                ) {
                    throw new Error('HTML-safe 7-bit raw reserved value at ' + index);
                }
                values[valueCount++] = current;
                continue;
            }
            var decodedToken = current < reverse.length
                ? reverse[current]
                : -1;
            if (decodedToken === undefined || decodedToken < 0) {
                throw new Error('HTML-safe 7-bit invalid escape at ' + index);
            }
            values[valueCount++] = escaped[decodedToken >>> 7];
            values[valueCount++] = decodedToken & 127;
        }
        var output = new Uint8Array(originalLength);
        var outputIndex = 0;
        var bitBuffer = 0;
        var bitCount = 0;
        for (var valueIndex = 0; valueIndex < valueCount; valueIndex += 1) {
            bitBuffer |= values[valueIndex] << bitCount;
            bitCount += 7;
            while (bitCount >= 8 && outputIndex < originalLength) {
                output[outputIndex++] = bitBuffer & 255;
                bitBuffer >>>= 8;
                bitCount -= 8;
            }
            if (outputIndex === originalLength) {
                break;
            }
        }
        if (outputIndex !== originalLength) {
            throw new Error(
                'HTML-safe 7-bit length mismatch: expected '
                + originalLength
                + ', got '
                + outputIndex
            );
        }
        element.textContent = '';
        if (element.parentNode) {
            element.parentNode.removeChild(element);
        }
        console.log(
            '[Playable Packer] HTML-safe 7-bit 解码完成：'
            + (output.byteLength / 1024 / 1024).toFixed(2)
            + ' MB'
        );
        return output;
    }

    async function decompressBrotli(
        compressedBytes
    ) {

         * 新版浏览器可能原生支持 Brotli。

         * gzip、deflate 和 deflate-raw，因此必须捕获
         * Unsupported compression format 并继续走回退。
         */

            typeof DecompressionStream
            === 'function'

                var stream = new Blob(
                    [compressedBytes]

                    .stream()
                    .pipeThrough(
                        new DecompressionStream(
                            'brotli'
                        )

                var nativeBuffer =
                    await new Response(
                        stream
                    ).arrayBuffer();

                console.log(
                    '[Playable Packer] 使用浏览器原生 Brotli 解码。'
                );

                return new Uint8Array(
                    nativeBuffer

            } catch (error) {

                    '[Playable Packer] 浏览器原生 Brotli 不可用，'
                    + '切换到内嵌 JavaScript 解码器。',
                    error

            window.__PACK_BROTLI_DECOMPRESS__;

        if (
            typeof fallback
            !== 'function'
        ) {
            throw new Error(
                '没有可用的 Brotli 解码器。'
                + (
                    nativeError
                    && nativeError.message
                        ? ' 原生解码错误：'
                            + nativeError.message
                        : ''
                )
            );
        }

        var fallbackResult =
            fallback(compressedBytes);

        if (
            fallbackResult
            && typeof fallbackResult.then
                === 'function'
        ) {
            fallbackResult =
                await fallbackResult;
        }

        var output =
            fallbackResult
            instanceof Uint8Array
                ? fallbackResult
                : new Uint8Array(
                    fallbackResult
                );

        console.log(
            '[Playable Packer] 使用内嵌 JavaScript Brotli 解码。'
        );

        return output;

    PackXMLHttpRequest.HEADERS_RECEIVED = 2;
    PackXMLHttpRequest.LOADING = 3;
    PackXMLHttpRequest.DONE = 4;

    window.XMLHttpRequest =
        PackXMLHttpRequest;

    /*
     * Cocos 3 loads the initial bundles after cc.game.init(). In a normal
     * web build the downloader reads those files from the network.  Register
     * equivalent in-memory handlers before index.js is evaluated so the
     * scene preload cannot wait forever for a URL that does not exist in the
     * Meta iframe.
     */
    function installCocosAssetMapDownloader() {
        var cocos = window.cc;

        if (
            !cocos
            || !cocos.assetManager
            || !cocos.assetManager.downloader
            || typeof cocos.assetManager.downloader.register
                !== 'function'
        ) {
            return false;
        }

        function asJson(url, _options, onComplete) {
            try {
                var key = normalizeUrl(url);
                var source = key ? getText(key) : null;
                onComplete(
                    source === null
                        ? new Error('Embedded JSON not found: ' + url)
                        : null,
                    source === null
                        ? null
                        : JSON.parse(source)
                );
            } catch (error) {
                onComplete(error, null);
            }

            resourceStats.xhrUnmapped += 1;
            reportUnmappedResource('XMLHttpRequest', this._url);
        }

        function asArrayBuffer(url, _options, onComplete) {
            var key = normalizeUrl(url);
            var bytes = key ? getBytes(key) : null;
            onComplete(
                bytes ? null : new Error('Embedded binary not found: ' + url),
                bytes
                    ? bytes.buffer.slice(
                        bytes.byteOffset,
                        bytes.byteOffset + bytes.byteLength
                    )
                    : null
            );
        }

        function asText(url, _options, onComplete) {
            var key = normalizeUrl(url);
            var source = key ? getText(key) : null;
            onComplete(
                source === null
                    ? new Error('Embedded text not found: ' + url)
                    : null,
                source
            );
        }

        function bytesToDataUrl(key) {
            var entry = FILES[key];
            var bytes = getBytes(key);

            if (!entry || !bytes) {
                return null;
            }

            var chunks = [];
            var chunkSize = 0x8000;

            for (
                var offset = 0;
                offset < bytes.length;
                offset += chunkSize
            ) {
                chunks.push(
                    String.fromCharCode.apply(
                        null,
                        bytes.subarray(
                            offset,
                            Math.min(
                                offset + chunkSize,
                                bytes.length
                            )
                        )
                    )
                );
            }

            return 'data:'
                + (entry.m || 'application/octet-stream')
                + ';base64,'
                + btoa(chunks.join(''));
        }

        function asImage(url, _options, onComplete) {
            var key = normalizeUrl(url);
            var dataUrl = key ? bytesToDataUrl(key) : null;

            resourceStats.imageLoads += 1;

            if (!dataUrl) {
                resourceStats.imageFailed += 1;
                onComplete(
                    new Error('Embedded image not found: ' + url),
                    null
                );
                return null;
            }

            var image = new Image();
            var completed = false;

            function finish(error) {
                if (completed) {
                    return;
                }

                completed = true;
                image.onload = null;
                image.onerror = null;

                if (error) {
                    resourceStats.imageFailed += 1;
                    onComplete(error, null);
                } else {
                    resourceStats.imageLoaded += 1;
                    onComplete(null, image);
                }
            }

            image.onload = function () {
                finish(null);
            };
            image.onerror = function () {
                finish(
                    new Error('Embedded image decode failed: ' + url)
                );
            };
            image.src = dataUrl;

            return image;
        }

        function asBundle(bundleName, _options, onComplete) {
            // Cocos registers Downloader callbacks after this handler returns.
            // A synchronous completion loses its callback list while creating
            // the builtin internal bundle, so emulate native async I/O.
            window.setTimeout(function () {
            try {
                resourceStats.bundleLoads += 1;
                var name = String(bundleName)
                    .replace(/\\\\/g, '/')
                    .replace(/^assets\//, '')
                    .replace(/\/$/, '');
                var keys = Object.keys(FILES);
                var indexPath = null;
                var configPath = null;

                for (var index = 0; index < keys.length; index += 1) {
                    var candidate = keys[index];
                    if (
                        candidate.indexOf('assets/' + name + '/') >= 0
                        && /\/index\.js$/i.test(candidate)
                    ) {
                        indexPath = candidate;
                    }
                    if (
                        candidate.indexOf('assets/' + name + '/') >= 0
                        && /\/config\.json$/i.test(candidate)
                    ) {
                        configPath = candidate;
                    }
                }

                if (!configPath) {
                    console.error(
                        '[Playable Packer] 未找到内嵌 Bundle：'
                        + name
                    );
                    onComplete(new Error('Embedded bundle not found: ' + name), null);
                    return;
                }

                console.info(
                    '[Playable Packer] 加载内嵌 Bundle：'
                    + name
                );

                if (indexPath) {
                    evaluateFile(indexPath);
                }

                var config = JSON.parse(getText(configPath));
                config.base = 'assets/' + name + '/';
                onComplete(null, config);
            } catch (error) {
                onComplete(error, null);
            }
            }, 0);
        }

        cocos.assetManager.downloader.register({
            bundle: asBundle,
            '.png': asImage,
            '.jpg': asImage,
            '.jpeg': asImage,
            '.bmp': asImage,
            '.gif': asImage,
            '.ico': asImage,
            '.tiff': asImage,
            '.webp': asImage,
            '.image': asImage,
        });

        return true;
    }

    /**
     * 拦截 DOM 元素的 src 属性。
     */
    function patchUrlProperty(
        prototype,
        propertyName
    ) {
        if (!prototype) {
            return;
        }

        var descriptor =
            Object.getOwnPropertyDescriptor(
                prototype,
                propertyName
            );

        if (
            !descriptor
            || typeof descriptor.set
                !== 'function'
        ) {
            return;
        }

        Object.defineProperty(
            prototype,
            propertyName,
            {
                configurable:
                    descriptor.configurable,

                enumerable:
                    descriptor.enumerable,

                get:
                    descriptor.get,

                set:
                    function (value) {
                        var mapped =
                            getBlobUrl(value);

                        descriptor.set.call(
                            this,
                            mapped || value
                        );
                    },
            }
        );
    }

    patchUrlProperty(
        window.HTMLImageElement
            && HTMLImageElement.prototype,
        'src'
    );

    patchUrlProperty(
        window.HTMLMediaElement
            && HTMLMediaElement.prototype,
        'src'
    );

    patchUrlProperty(
        window.HTMLSourceElement
            && HTMLSourceElement.prototype,
        'src'
    );

    patchUrlProperty(
        window.HTMLScriptElement
            && HTMLScriptElement.prototype,
        'src'
    );

    /**
     * 拦截动态加入的 style 标签。
     */
    function rewriteStyleElement(
        element
    ) {
        if (
            !element
            || element.nodeType !== 1
            || String(element.tagName)
                .toUpperCase()
                !== 'STYLE'
        ) {
            return;
        }

        var cssText =
            element.textContent;

        if (
            typeof cssText === 'string'
            && cssText.indexOf(
                'url('
            ) >= 0
        ) {
            element.textContent =
                rewriteCssResourceUrls(
                    cssText
                );
        }
    }

    var nativeAppendChild =
        Node.prototype.appendChild;

    Node.prototype.appendChild =
        function (child) {
            rewriteStyleElement(child);

            return nativeAppendChild.call(
                this,
                child
            );
        };

    var nativeInsertBefore =
        Node.prototype.insertBefore;

    Node.prototype.insertBefore =
        function (
            newNode,
            referenceNode
        ) {
            rewriteStyleElement(
                newNode
            );

            return nativeInsertBefore.call(
                this,
                newNode,
                referenceNode
            );
        };

    /**
     * 拦截：
     *
     * styleSheet.insertRule(...)
     */
    if (
        window.CSSStyleSheet
        && CSSStyleSheet.prototype
            .insertRule
    ) {
        var nativeInsertRule =
            CSSStyleSheet.prototype
                .insertRule;

        CSSStyleSheet.prototype
            .insertRule =
            function (
                rule,
                index
            ) {
                var rewrittenRule =
                    rewriteCssResourceUrls(
                        String(rule)
                    );

                if (
                    index === undefined
                ) {
                    return nativeInsertRule.call(
                        this,
                        rewrittenRule
                    );
                }

                return nativeInsertRule.call(
                    this,
                    rewrittenRule,
                    index
                );
            };
    }

    /**
     * 拦截：
     *
     * style.setProperty(
     *     "src",
     *     "url(...)"
     * );
     */
    if (
        window.CSSStyleDeclaration
        && CSSStyleDeclaration
            .prototype
            .setProperty
    ) {
        var nativeSetProperty =
            CSSStyleDeclaration
                .prototype
                .setProperty;

        CSSStyleDeclaration
            .prototype
            .setProperty =
            function (
                propertyName,
                value,
                priority
            ) {
                var nextValue =
                    typeof value === 'string'
                        ? rewriteCssResourceUrls(
                            value
                        )
                        : value;

                return nativeSetProperty.call(
                    this,
                    propertyName,
                    nextValue,
                    priority
                );
            };
    }

    /**
     * 拦截 FontFace。
     */
    if (window.FontFace) {
        var NativeFontFace =
            window.FontFace;

        window.FontFace = function (
            family,
            source,
            descriptors
        ) {
            var transformedSource =
                source;

            if (
                typeof source
                === 'string'
            ) {
                transformedSource =
                    rewriteCssResourceUrls(
                        source
                    );
            }

            return new NativeFontFace(
                family,
                transformedSource,
                descriptors
            );
        };

        window.FontFace.prototype =
            NativeFontFace.prototype;
    }

    /**
     * 浏览器要求用户交互后才能启动 AudioContext。
     *
     * 首次点击或触摸时尝试恢复。
     */
    function resumeAudioContexts() {
        var context =
            window.__audioContext
            || window.audioContext;

        if (
            context
            && typeof context.resume
                === 'function'
            && context.state
                === 'suspended'
        ) {
            context.resume().catch(
                function () {}
            );
        }

        /*
         * Cocos 通常会自行监听用户输入恢复音频。
         * 这里额外尝试恢复页面上可访问到的音频元素。
         */
        var mediaElements =
            document.querySelectorAll(
                'audio,video'
            );

        for (
            var index = 0;
            index < mediaElements.length;
            index += 1
        ) {
            var media =
                mediaElements[index];

            if (
                media
                && media.paused
                && media.autoplay
                && typeof media.play
                    === 'function'
            ) {
                media.play().catch(
                    function () {}
                );
            }
        }
    }

    var unlockEvents = [
        'pointerdown',
        'touchstart',
        'mousedown',
        'keydown',
    ];

    function unlockAudioOnce() {
        resumeAudioContexts();

        for (
            var index = 0;
            index < unlockEvents.length;
            index += 1
        ) {
            window.removeEventListener(
                unlockEvents[index],
                unlockAudioOnce,
                true
            );
        }
    }

    for (
        var unlockIndex = 0;
        unlockIndex
            < unlockEvents.length;
        unlockIndex += 1
    ) {
        window.addEventListener(
            unlockEvents[unlockIndex],
            unlockAudioOnce,
            true
        );
    }

    /**
     * 本地预览用渠道桩。
     */
    if (
        !window.ALPlayableAnalytics
    ) {
        window.ALPlayableAnalytics = {
            trackEvent:
                function (name) {
                    console.log(
                        '[PlayableAnalytics]',
                        name
                    );
                },
        };
    }

    if (!window.mraid) {
        var mraidListeners =
            Object.create(null);

        window.mraid = {
            getState:
                function () {
                    return 'default';
                },

            getVersion:
                function () {
                    return 'preview';
                },

            isViewable:
                function () {
                    return true;
                },

            getScreenSize:
                function () {
                    return {
                        width:
                            window
                                .innerWidth,

                        height:
                            window
                                .innerHeight,
                    };
                },

            getMaxSize:
                function () {
                    return {
                        width:
                            window
                                .innerWidth,

                        height:
                            window
                                .innerHeight,
                    };
                },

            addEventListener:
                function (
                    name,
                    callback
                ) {
                    mraidListeners[name] =
                        callback;
                },

            removeEventListener:
                function (name) {
                    delete mraidListeners[
                        name
                    ];
                },

            open:
                function (url) {
                    window.open(
                        url,
                        '_blank'
                    );
                },
        };
    }

    if (!window.xsd_playable) {
        window.xsd_playable = {
            adapter:
                function () {},

            download:
                function () {},

            mraidOpen:
                function () {},

            gameReady:
                function () {},

            gameEnd:
                function () {},

            onInteracted:
                function () {},

            playableSDKsendEvent:
                function () {},
        };
    }

    /**
     * 在全局作用域执行 JS 文件。
     */
    function evaluateFile(filePath) {
        var source =
            getText(filePath);
        var script = document.createElement(
            'script'
        );

        /*
         * Meta Preview's iframe can prohibit eval() through CSP.  A classic
         * script element is permitted there and matches the established
         * asset-map playable loader behaviour.
         */
        script.text = source
            + '\n//# sourceURL='
            + BASE
            + filePath;
        document.head.appendChild(script);
        script.remove();
    }

    async function boot() {
        /*
         * 先恢复完整资源归档，之后 VFS 才能同步读取文件。
         */
        setBootStage('archive:decode');
        await initializeArchive();
        setBootStage('archive:ready');

        /*
         * 原始执行顺序：
         *
         * polyfills
         * system.bundle
         */
        setBootStage('runtime:load');
        for (
            var runtimeIndex = 0;
            runtimeIndex
                < BOOT.runtime.length;
            runtimeIndex += 1
        ) {
            evaluateFile(
                BOOT.runtime[
                    runtimeIndex
                ]
            );
        }

        if (!window.System) {
            throw new Error(
                'SystemJS 初始化失败。'
            );
        }
        setBootStage('systemjs:ready');

        /*
         * Meta Playable Preview 的 iframe 会通过 Permissions Policy
         * 禁用 Gamepad API。部分 Cocos 运行时会在初始化输入系统时
         * 直接调用 navigator.getGamepads()，该调用会同步抛异常并中断
         * 整个游戏启动。这里仅在调用受限时回退为空手柄列表。
         */
        if (
            window.navigator
            && typeof window.navigator.getGamepads
                === 'function'
        ) {
            var nativeGetGamepads =
                window.navigator.getGamepads.bind(
                    window.navigator
                );

            try {
                Object.defineProperty(
                    window.navigator,
                    'getGamepads',
                    {
                        configurable: true,
                        value: function () {
                            try {
                                return nativeGetGamepads();
                            } catch (error) {
                                return [];
                            }
                        },
                    }
                );
            } catch (error) {
                /* 浏览器不允许覆写时保持原实现。 */
            }
        }

        /*
         * 安装 Import Map。Cocos Creator 附带的 SystemJS 精简版
         * 不一定包含动态 Import Map extra；因此同时补上 resolve
         * 映射，保证 cc 等裸模块名在所有 WebView 中都能解析。
         */
        var originalSystemResolve =
            System.resolve;

        System.resolve = function (
            moduleName,
            parentUrl
        ) {
            var imports =
                BOOT.importMap
                && BOOT.importMap.imports;

            var mappedModuleName =
                imports
                && imports[moduleName];

            return originalSystemResolve.call(
                this,
                mappedModuleName || moduleName,
                parentUrl
            );
        };

        if (
            typeof System.addImportMap
            === 'function'
        ) {
            System.addImportMap(
                BOOT.importMap
            );
        } else {
            var importMapElement =
                document.createElement(
                    'script'
                );

            importMapElement.type =
                'systemjs-importmap';

            importMapElement
                .textContent =
                JSON.stringify(
                    BOOT.importMap
                );

            document.head.appendChild(
                importMapElement
            );
        }
        setBootStage('import-map:ready');

        /*
         * 执行全部 System.register 文件。
         *
         * 这里只注册模块，不立即执行模块主体。
         */
        setBootStage('modules:register');
        for (
            var moduleIndex = 0;
            moduleIndex
                < BOOT.modules.length;
            moduleIndex += 1
        ) {
            evaluateFile(
                BOOT.modules[
                    moduleIndex
                ]
            );
        }

        /*
         * 让 SystemJS named-register 的清理微任务
         * 先执行完毕。
         */
        await Promise.resolve();
        setBootStage('engine:preload');

        if (
            BOOT.importMap
            && BOOT.importMap.imports
            && BOOT.importMap.imports.cc
        ) {
            await System.import('cc');
        }

        if (installCocosAssetMapDownloader()) {
            console.info(
                '[Playable Packer] Cocos 资源映射下载器已安装。'
            );
        } else {
            console.warn(
                '[Playable Packer] 未找到 Cocos 资源下载器；将使用通用 VFS。'
            );
        }

        setBootStage('entry:import');

        var entryImportWatchdog = setTimeout(
            function () {
                if (bootStage === 'entry:import') {
                    console.error(
                        '[Playable Packer] 启动仍在等待入口模块：'
                        + BOOT.entry
                    );
                }
            },
            8000
        );

        /*
         * 导入 Cocos 启动入口。
         */
        try {
            await System.import(
                BOOT.entry
            );
        } finally {
            clearTimeout(entryImportWatchdog);
        }
        setBootStage('completed');

        /*
         * Meta Playable Preview occasionally starts the iframe while it is
         * still visually suspended. Cocos has completed game.run() in that
         * state, but its first requestAnimationFrame callback never arrives,
         * leaving _shouldLoadLaunchScene pending forever. This is deliberately
         * a narrow recovery path: a real first frame always wins, and we only
         * invoke the same Cocos update method once after the game is running.
         */
        window.setTimeout(
            function () {
                var cocos = window.cc;
                var game = cocos && cocos.game;
                var director = cocos && cocos.director;

                if (
                    !game
                    || !director
                    || typeof game.isPaused !== 'function'
                    || game.isPaused()
                    || (typeof director.getScene === 'function'
                        && director.getScene())
                    || typeof game._updateCallback !== 'function'
                ) {
                    return;
                }

                var launchScene =
                    cocos.settings
                    && typeof cocos.settings.querySettings
                        === 'function'
                    ? cocos.settings.querySettings(
                        'launch',
                        'launchScene'
                    )
                    : null;
                var mainBundle =
                    cocos.assetManager
                    && typeof cocos.assetManager.getBundle
                        === 'function'
                    ? cocos.assetManager.getBundle('main')
                    : null;
                var hasLaunchScene =
                    !!mainBundle
                    && typeof mainBundle.getSceneInfo
                        === 'function'
                    && !!mainBundle.getSceneInfo(
                        launchScene
                    );

                console.warn(
                    '[Playable Packer] 首帧未调度，触发 Cocos 首场景恢复：'
                    + JSON.stringify({
                        launchScene: launchScene,
                        hasMainBundle: !!mainBundle,
                        hasLaunchScene: hasLaunchScene,
                        loadingScene:
                            director._loadingScene || null,
                    })
                );

                // If a prior, throttled frame already consumed
                // _shouldLoadLaunchScene, calling _updateCallback again is a
                // no-op. Request the exact configured scene directly instead.
                if (
                    launchScene
                    && !director._loadingScene
                    && typeof director.loadScene === 'function'
                ) {
                    director.loadScene(
                        launchScene,
                        function (error) {
                            if (error) {
                                console.error(
                                    '[Playable Packer] 首场景恢复失败：',
                                    error
                                );
                            }
                        }
                    );
                    return;
                }

                game._shouldLoadLaunchScene = true;
                game._updateCallback();
            },
            1500
        );

        /*
         * The established Cocos asset-map delivery removes its preloader as
         * soon as the entry module has finished.  Meta Preview can suppress
         * the WebGL hook used by our visual loading-screen heuristic, which
         * otherwise leaves an opaque black overlay above a successfully
         * started canvas.
         */
        window.setTimeout(
            function () {
                var loadingScreen =
                    window.__CPP_LOADING_SCREEN__;

                if (
                    loadingScreen
                    && typeof loadingScreen.complete
                        === 'function'
                ) {
                    loadingScreen.complete();
                }
            },
            180
        );

        window.setTimeout(
            function () {
                var cocos = window.cc;
                var sceneName = null;
                var paused = null;

                try {
                    sceneName = cocos
                        && cocos.director
                        && cocos.director.getScene()
                            ? cocos.director.getScene().name
                            : null;
                    paused = cocos
                        && cocos.game
                        && typeof cocos.game.isPaused
                            === 'function'
                                ? cocos.game.isPaused()
                                : null;
                } catch (_error) {}

                console.info(
                    '[Playable Packer] 首场景诊断：'
                    + JSON.stringify({
                        scene: sceneName,
                        paused: paused,
                        resources: resourceStats,
                    })
                );
            },
            8000
        );
    }

    boot().catch(
        function (error) {
            console.error(
                '[Playable Packer] 启动失败：',
                error
            );

            var errorElement =
                document.createElement(
                    'pre'
                );

            errorElement.style.position =
                'fixed';

            errorElement.style.left =
                '0';

            errorElement.style.top =
                '0';

            errorElement.style.right =
                '0';

            errorElement.style.zIndex =
                '999999';

            errorElement.style.margin =
                '0';

            errorElement.style.padding =
                '12px';

            errorElement.style.background =
                '#300';

            errorElement.style.color =
                '#fff';

            errorElement.style.whiteSpace =
                'pre-wrap';

            errorElement.textContent =
                'Playable 启动失败\n\n'
                + (
                    error
                    && error.stack
                        ? error.stack
                        : String(error)
                );

            document.body.appendChild(
                errorElement
            );
        }
    );
})();

</script>
</body>
</html>
